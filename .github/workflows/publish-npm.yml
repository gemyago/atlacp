name: Publish npm Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Go dependencies
        run: go mod download && go install tool

      - name: Build dist artifacts
        run: make -C build dist

      - name: Publish npm packages
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION_INPUT:-$RELEASE_VERSION}"

          if [ -z "$VERSION" ]; then
            echo "::error::Missing version. Use workflow_dispatch input 'version' or trigger from a release event."
            exit 1
          fi

          VERSION="${VERSION#v}"
          NPM_PUBLISH_NOOP=false make -C build npm/publish VERSION="$VERSION"
