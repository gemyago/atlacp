name: Publish npm Packages

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Go dependencies
        run: go mod download && go install tool

      - name: Build binaries (all platforms)
        run: make -C build dist

      - name: Populate npm packages
        env:
          NPM_VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${NPM_VERSION#v}"
          make -C build npm-packages VERSION="$VERSION"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in npm/install-linux-x64 npm/install-linux-arm64 npm/install-darwin-x64 npm/install-darwin-arm64; do
            npm publish "$pkg" --provenance --access public
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/install --provenance --access public
