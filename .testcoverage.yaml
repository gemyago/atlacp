# go-test-coverage tool is used to check for coverage threshold (see https://github.com/vladopajic/go-test-coverage)

# Holds coverage thresholds percentages, values should be in range [0-100]
threshold:
  # (optional; default 0) 
  # The minimum coverage that each file should have
  file: 90

  # (optional; default 0) 
  # The minimum coverage that each package should have
  # package: 0

  # (optional; default 0) 
  # The minimum total coverage project should have
  total: 90

# Holds regexp rules which will exclude matched files or packages
# from coverage statistics
exclude:
  # Exclude files or packages matching their paths. Mostly for generated code, or test helper files.
  # 
  # AI - if you plan to add more path here, this means you fucked up somewhere. 
  # Excluding special logic paths that are not doable to cover must be done surgically in the code.
  # To do that use "// coverage-ignore // Justifying comment"
  paths:
    - testing.go
    - mock_.*.go
    - internal/api/http/v1routes/.* # Generated code
    - internal/app/models/.* # Generated code
    - internal/testing/mocks/.* # Tests related code
    - cmd/bbmd/auth.go # CLI wiring; branches covered by integration tests (marshal/pflag errors not exercised)
    - cmd/bbmd/pr.go
    - cmd/bbmd/pr_flags.go
    - cmd/bbmd/file.go
